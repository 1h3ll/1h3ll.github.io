<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PassForge — Strong Password Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #00ffe0;
      --accent2: #ff3cac;
      --text: #e2e2e2;
      --muted: #555570;
      --mono: 'Share Tech Mono', monospace;
      --display: 'Bebas Neue', sans-serif;
      --body: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,224,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,224,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .logo {
      font-family: var(--display);
      font-size: clamp(3rem, 8vw, 5.5rem);
      letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 40px rgba(0,255,224,0.4), 0 0 80px rgba(0,255,224,0.1);
      line-height: 1;
    }

    .tagline {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.2rem 0.8rem;
      border: 1px solid var(--accent2);
      color: var(--accent2);
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 2px;
    }

    /* Password list */
    .password-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .pw-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 4px;
      padding: 0.85rem 1rem;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      cursor: default;
      animation: slideIn 0.4s ease both;
    }

    .pw-row:hover {
      border-left-color: var(--accent);
      background: #15151f;
      transform: translateX(3px);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .pw-num {
      font-family: var(--display);
      font-size: 1.1rem;
      color: var(--muted);
      min-width: 1.6rem;
      letter-spacing: 1px;
    }

    .pw-text {
      font-family: var(--mono);
      font-size: 0.92rem;
      color: var(--text);
      flex: 1;
      word-break: break-all;
      letter-spacing: 1px;
    }

    .pw-strength {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
    }
    .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.3rem 0.6rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,255,224,0.05);
    }

    .copy-btn.copied {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    /* Controls */
    .controls {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .regen-btn {
      flex: 1;
      min-width: 160px;
      padding: 0.9rem 1.5rem;
      background: var(--accent);
      color: #000;
      font-family: var(--display);
      font-size: 1.1rem;
      letter-spacing: 3px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(0,255,224,0.25);
    }

    .regen-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 0 35px rgba(0,255,224,0.4);
    }

    .regen-btn:active { transform: scale(0.98); }

    .options {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .opt-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: all 0.15s;
    }

    .opt-label:hover { border-color: var(--accent); color: var(--text); }

    .opt-label input[type=checkbox] {
      accent-color: var(--accent);
      width: 13px; height: 13px;
    }

    .len-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .len-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type=range] {
      flex: 1;
      accent-color: var(--accent);
      height: 3px;
    }

    .len-val {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
      min-width: 2rem;
      text-align: right;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Scanline overlay */
    .scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="scanline"></div>

  <div class="container">
    <header>
      <div class="logo">PassForge</div>
      <div class="tagline">Cryptographic Password Generator</div>
      <div class="badge">10 Unique Passwords Per Load</div>
    </header>

    <div class="password-list" id="pwList"></div>

    <div class="controls">
      <button class="regen-btn" onclick="generateAll()">↻ REGENERATE</button>

      <div class="options">
        <label class="opt-label">
          <input type="checkbox" id="optUpper" checked> A–Z
        </label>
        <label class="opt-label">
          <input type="checkbox" id="optLower" checked> a–z
        </label>
        <label class="opt-label">
          <input type="checkbox" id="optNum" checked> 0–9
        </label>
        <label class="opt-label">
          <input type="checkbox" id="optSym" checked> !@#
        </label>
      </div>

      <div class="len-row">
        <span class="len-label">Length</span>
        <input type="range" id="pwLen" min="12" max="40" value="20" oninput="document.getElementById('lenVal').textContent=this.value" />
        <span class="len-val" id="lenVal">20</span>
      </div>
    </div>

    <footer>
      Generated client-side &mdash; never sent to any server &bull;
      <a href="https://github.com" target="_blank">Host on GitHub Pages</a>
    </footer>
  </div>

  <script>
    const UPPER  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const LOWER  = 'abcdefghijklmnopqrstuvwxyz';
    const NUMS   = '0123456789';
    const SYMS   = '!@#$%^&*()-_=+[]{}|;:,.<>?';

    function secureRandom(max) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % max;
    }

    function generatePassword(length, useUpper, useLower, useNum, useSym) {
      let pool = '';
      let required = [];

      if (useUpper) { pool += UPPER; required.push(UPPER[secureRandom(UPPER.length)]); }
      if (useLower) { pool += LOWER; required.push(LOWER[secureRandom(LOWER.length)]); }
      if (useNum)   { pool += NUMS;  required.push(NUMS[secureRandom(NUMS.length)]); }
      if (useSym)   { pool += SYMS;  required.push(SYMS[secureRandom(SYMS.length)]); }

      if (!pool) pool = LOWER + NUMS; // fallback

      let pw = [...required];
      while (pw.length < length) pw.push(pool[secureRandom(pool.length)]);

      // Fisher-Yates shuffle
      for (let i = pw.length - 1; i > 0; i--) {
        const j = secureRandom(i + 1);
        [pw[i], pw[j]] = [pw[j], pw[i]];
      }
      return pw.join('');
    }

    function strengthDots(pw) {
      const hasMix = /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
      const score = Math.min(5, Math.floor(pw.length / 6) + (hasMix ? 1 : 0));
      return score;
    }

    function generateAll() {
      const len     = parseInt(document.getElementById('pwLen').value);
      const useUpper = document.getElementById('optUpper').checked;
      const useLower = document.getElementById('optLower').checked;
      const useNum   = document.getElementById('optNum').checked;
      const useSym   = document.getElementById('optSym').checked;

      const list = document.getElementById('pwList');
      list.innerHTML = '';

      for (let i = 1; i <= 10; i++) {
        const pw = generatePassword(len, useUpper, useLower, useNum, useSym);
        const score = strengthDots(pw);

        const row = document.createElement('div');
        row.className = 'pw-row';
        row.style.animationDelay = `${(i - 1) * 0.04}s`;

        const dotsHTML = Array.from({length: 5}, (_, d) =>
          `<span class="dot ${d < score ? 'on' : ''}"></span>`
        ).join('');

        row.innerHTML = `
          <span class="pw-num">${String(i).padStart(2,'0')}</span>
          <span class="pw-text" id="pw${i}">${pw}</span>
          <div class="pw-strength">${dotsHTML}</div>
          <button class="copy-btn" onclick="copyPw(this, 'pw${i}')">COPY</button>
        `;
        list.appendChild(row);
      }
    }

    function copyPw(btn, id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✓ COPIED';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'COPY';
          btn.classList.remove('copied');
        }, 1800);
      });
    }

    // Generate on load
    generateAll();
  </script>
</body>
</html>
